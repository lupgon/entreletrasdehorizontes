<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entre Letras de Horizonte</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Georgia, serif; background: #f5f0e8; color: #1a1a2e; min-height: 100vh; }

  header {
    background: linear-gradient(135deg, #1a2a5e 0%, #2d4a8a 60%, #1a2a5e 100%);
    padding: 24px 20px 18px;
    text-align: center;
    box-shadow: 0 3px 12px rgba(0,0,0,0.3);
  }
  header img { width: 110px; height: 110px; object-fit: contain; filter: drop-shadow(0 2px 8px rgba(0,0,0,0.4)); }
  header h1 { color: #fff; font-size: 20px; font-weight: 700; margin-top: 8px; text-shadow: 0 1px 4px rgba(0,0,0,0.3); }
  header p { color: #c8d8f8; font-size: 12px; margin-top: 3px; font-style: italic; }

  .container { max-width: 680px; margin: 0 auto; padding: 18px 14px 40px; }

  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .top-bar span { font-size: 12px; color: #666; font-style: italic; }
  .btn-add {
    background: #1a2a5e; color: #fff; border: none; border-radius: 20px;
    padding: 7px 16px; font-size: 13px; cursor: pointer; font-family: Georgia, serif;
    display: flex; align-items: center; gap: 6px; text-decoration: none;
  }
  .btn-add:hover { background: #2d4a8a; }

  .book-card {
    background: #fff; border-radius: 10px; margin-bottom: 14px; overflow: hidden;
    box-shadow: 0 1px 6px rgba(0,0,0,0.08); border: 1px solid #e0d8cc;
  }
  .book-header { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid #f0e8dc; }
  .book-num { font-size: 14px; font-weight: 700; color: #1a2a5e; min-width: 22px; text-align: center; flex-shrink: 0; }
  .book-cover { width: 36px; height: 50px; object-fit: cover; border-radius: 3px; flex-shrink: 0; box-shadow: 0 1px 4px rgba(0,0,0,0.2); }
  .book-meta { flex: 1; min-width: 0; }
  .book-title { font-size: 14px; font-weight: 700; color: #1a1a2e; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .book-author { font-size: 12px; color: #c47a20; font-style: italic; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .book-summary { padding: 10px 14px 12px; font-size: 13px; color: #444; line-height: 1.6; }

  .add-form {
    background: #fff; border-radius: 10px; border: 2px dashed #c0b8a8;
    padding: 20px; margin-top: 18px; display: none;
  }
  .add-form.open { display: block; }
  .add-form h3 { font-size: 15px; color: #1a2a5e; margin-bottom: 14px; }
  .add-form input, .add-form textarea {
    width: 100%; border: 1px solid #d0c8bc; border-radius: 6px;
    padding: 9px 11px; font-size: 13px; font-family: Georgia, serif;
    margin-bottom: 10px; background: #faf8f4; color: #1a1a2e;
  }
  .add-form textarea { height: 80px; resize: vertical; }
  .cover-row { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 10px; }
  .cover-preview { width: 44px; height: 60px; object-fit: cover; border-radius: 4px; border: 1px solid #ccc; display: none; flex-shrink: 0; }
  .cover-row input { flex: 1; margin-bottom: 0; }
  .form-btns { display: flex; gap: 10px; justify-content: flex-end; }
  .btn-save { background: #1a2a5e; color: #fff; border: none; border-radius: 20px; padding: 8px 20px; font-size: 13px; cursor: pointer; font-family: Georgia, serif; }
  .btn-cancel { background: transparent; color: #888; border: 1px solid #ccc; border-radius: 20px; padding: 8px 16px; font-size: 13px; cursor: pointer; font-family: Georgia, serif; }

  .loading { text-align: center; padding: 40px; color: #888; font-style: italic; }
  footer { text-align: center; padding: 20px; font-size: 11px; color: #aaa; }
</style>
</head>

let books = [];

async function loadBooks() {
  try {
    const r = await window.storage.get('books');
    if (r) {
      books = JSON.parse(r.value);
    } else {
      books = DEFAULT_BOOKS;
      await window.storage.set('books', JSON.stringify(books));
    }
  } catch(e) {
    books = DEFAULT_BOOKS;
  }
  render();
}

async function saveBooks() {
  try { await window.storage.set('books', JSON.stringify(books)); } catch(e) {}
}

function render() {
  const list = document.getElementById('book-list');
  const count = document.getElementById('book-count');
  count.textContent = books.length + ' libros';
  list.innerHTML = '';
  books.forEach((b, i) => {
    const card = document.createElement('div');
    card.className = 'book-card';
    card.innerHTML = `
      <div class="book-header">
        <span class="book-num">${i+1}</span>
        <img class="book-cover" src="${b.coverData || ''}" alt="portada" onerror="this.style.display='none'">
        <div class="book-meta">
          <div class="book-title">${b.title}</div>
          <div class="book-author">${b.author}</div>
        </div>
      </div>
      ${b.summary ? `<div class="book-summary">${b.summary}</div>` : ''}
    `;
    list.appendChild(card);
  });
}

function toggleForm() {
  const f = document.getElementById('add-form');
  f.classList.toggle('open');
  if (f.classList.contains('open')) f.scrollIntoView({ behavior:'smooth', block:'start' });
}

function previewCover(input) {
  const file = input.files[0];
  const preview = document.getElementById('cover-preview');
  if (file) {
    const reader = new FileReader();
    reader.onload = e => { preview.src = e.target.result; preview.style.display = 'block'; };
    reader.readAsDataURL(file);
  }
}

async function addBook() {
  const title = document.getElementById('new-title').value.trim();
  const author = document.getElementById('new-author').value.trim();
  const summary = document.getElementById('new-summary').value.trim();
  const coverInput = document.getElementById('new-cover');
  if (!title || !author) { alert('Por favor ingresa título y autor.'); return; }

  const newBook = { id: Date.now(), title, author, summary, coverData: '' };

  if (coverInput.files[0]) {
    const reader = new FileReader();
    reader.onload = async e => {
      newBook.coverData = e.target.result;
      books.push(newBook);
      await saveBooks();
      render();
      resetForm();
    };
    reader.readAsDataURL(coverInput.files[0]);
  } else {
    books.push(newBook);
    await saveBooks();
    render();
    resetForm();
  }
}

function resetForm() {
  document.getElementById('new-title').value = '';
  document.getElementById('new-author').value = '';
  document.getElementById('new-summary').value = '';
  document.getElementById('new-cover').value = '';
  document.getElementById('cover-preview').style.display = 'none';
  toggleForm();
  const last = document.getElementById('book-list').lastElementChild;
  if (last) last.scrollIntoView({ behavior:'smooth', block:'start' });
}

loadBooks();
</script>
